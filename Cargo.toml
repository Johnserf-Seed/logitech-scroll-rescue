[package]
name = "logitech-scroll-rescue"
version = "0.1.0"
edition = "2024"
description = "Windows GUI and CLI for restarting a Logitech USB receiver"
license = "MIT"
default-run = "scroll-rescue"

[features]
visual-qa = []

[dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "scroll-rescue"
path = "src/main.rs"

[[bin]]
name = "scroll-rescue-cli"
path = "src/bin/cli.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
